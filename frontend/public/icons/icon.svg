<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1b3a6b"/>
      <stop offset="70%" stop-color="#0b1d3a"/>
      <stop offset="100%" stop-color="#050e1d"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe885"/>
      <stop offset="35%" stop-color="#d9ad35"/>
      <stop offset="70%" stop-color="#997011"/>
      <stop offset="100%" stop-color="#d9ad35"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Rim -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="12" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#ffe885" stroke-width="3" opacity="0.6"/>

  <!-- Inner Circle Shield -->
  <circle cx="256" cy="256" r="195" fill="#081528"/>

  <!-- 5-Point Police Star -->
  <polygon points="256,75 306,182 426,187 332,260 364,375 256,310 148,375 180,260 86,187 206,182"
           fill="url(#goldGrad)" stroke="#594005" stroke-width="4" filter="url(#shadow)"/>

  <!-- Center Crest Circle -->
  <circle cx="256" cy="256" r="62" fill="#0b1d3a" stroke="url(#goldGrad)" stroke-width="6"/>
  
  <!-- Ashoka Chakra Spokes Motif in Center -->
  <circle cx="256" cy="256" r="42" fill="none" stroke="#ffe885" stroke-width="3"/>
  <circle cx="256" cy="256" r="10" fill="#ffe885"/>

  <!-- Ribbon Banner at Bottom -->
  <path d="M 120 405 Q 256 380 392 405 L 372 445 Q 256 425 140 445 Z" fill="url(#goldGrad)" stroke="#594005" stroke-width="2" filter="url(#shadow)"/>
  <text x="256" y="433" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#0b1d3a" text-anchor="middle" letter-spacing="3">CCTNS • CG POLICE</text>
</svg>
